name: CI/CD - Build, Test & Push Microservices

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # GHCR'e push izni

jobs:
  build:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: authservice
            dir: AuthService
          - service: productservice
            dir: ProductService

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        working-directory: ./services/${{ matrix.dir }}
        run: dotnet restore

      - name: Build
        working-directory: ./services/${{ matrix.dir }}
        run: dotnet build --configuration Release --no-restore

      - name: Test
        working-directory: ./services/${{ matrix.dir }}
        run: dotnet test --configuration Release --no-build --verbosity normal
        continue-on-error: true

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        working-directory: ./services/${{ matrix.dir }}
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Push to GHCR
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: Summary
        run: |
          echo "## 🐳 Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`$IMAGE_NAME:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest:** \`$IMAGE_NAME:latest\`" >> $GITHUB_STEP_SUMMARY
