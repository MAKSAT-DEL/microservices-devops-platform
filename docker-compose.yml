services:
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data

  authservice:
    build:
      context: ./services/AuthService
      dockerfile: Dockerfile
    container_name: authservice
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=auth-db;Database=authdb;Username=postgres;Password=postgrespassword
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_SERVICE_NAME=authservice
    depends_on:
      - auth-db

  # ---------------------------------------------------
  # PRODUCT SERVICE & DB
  # ---------------------------------------------------
  product-db:
    image: postgres:16-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"  
    volumes:
      - product_pgdata:/var/lib/postgresql/data

  productservice:
    build:
      context: ./services/ProductService
      dockerfile: Dockerfile
    container_name: productservice
    ports:
      - "8081:8080"  
    environment:
      - ConnectionStrings__DefaultConnection=Host=product-db;Database=productdb;Username=postgres;Password=postgrespassword
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_SERVICE_NAME=productservice
    depends_on:
      - product-db

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"  
    volumes:
      - ./monitoring:/etc/prometheus   
    depends_on:
      - authservice
      - productservice   
    networks:
      - default  

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"                         
    environment:
      - GF_SECURITY_ADMIN_USER=admin         
      - GF_SECURITY_ADMIN_PASSWORD=admin123  
    volumes:
      - grafana_data:/var/lib/grafana        
    depends_on:
      - prometheus                          
    networks:
      - default 

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
    networks:
      - default

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - default   

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: -config.file=/etc/tempo/tempo.yml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/tempo-config.yml:/etc/tempo/tempo.yml
    networks:
      - default                                

volumes:
  auth_pgdata:
  product_pgdata:
  grafana_data: