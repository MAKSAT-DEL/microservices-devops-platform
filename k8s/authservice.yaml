apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
spec:
  replicas: 2             # ⚡ Yüksek erişilebilirlik için 2 kopya!
  selector:
    matchLabels:
      app: authservice
  template:
    metadata:
      labels:
        app: authservice
    spec:
      containers:
        - name: authservice
          # 👇 BURASI KRİTİK: Az önce CI ile GHCR'e attığımız paket!
          image: ghcr.io/maksat-del/authservice:latest 
          env:
            - name: ConnectionStrings__DefaultConnection
              # Host kısmında 'auth-db' yazıyor çünkü yukarıda Service adını öyle verdik.
              # Kubernetes DNS otomatik çözer.
              value: Host=auth-db;Database=authdb;Username=postgres;Password=postgrespassword
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: authservice
spec:
  selector:
    app: authservice
  ports:
    - port: 8080
      targetPort: 8080