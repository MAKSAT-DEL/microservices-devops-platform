apiVersion: apps/v1
kind: Deployment
metadata:
  name: productservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: productservice
  template:
    metadata:
      labels:
        app: productservice
    spec:
      initContainers:              # ← BURAYA EKLEDİK
        - name: wait-for-postgres
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z product-db 5432; do echo waiting for db; sleep 2; done;']
      containers:
        - name: productservice
          image: ghcr.io/maksat-del/productservice:latest 
          env:
            - name: ConnectionStrings__DefaultConnection
              value: Host=product-db;Database=productdb;Username=postgres;Password=postgrespassword
          ports:
            - containerPort: 8080
# ... Service kısmı değişmedi ...
---
# --- PRODUCT SERVICE NETWORKING ---
apiVersion: v1
kind: Service
metadata:
  name: productservice        # DNS ismi: productservice.microservices.svc.cluster.local
spec:
  selector:
    app: productservice       # Yukarıdaki etikete sahip pod'lara trafik yönlendir
  ports:
    - port: 8080              # Servisin dışarıdan baktığı port
      targetPort: 8080        # Pod'un içindeki gerçek port