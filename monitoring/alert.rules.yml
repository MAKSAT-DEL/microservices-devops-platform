groups:
  - name: microservices_alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "🚨 {{ $labels.instance }} çöktü!"
          description: "{{ $labels.job }} servisi 1 dakikadır ayakta değil."
