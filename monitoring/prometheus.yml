global:
  scrape_interval: 15s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: authservice
    static_configs:
      - targets: ['authservice:8080']

  - job_name: productservice
    static_configs:
      - targets: ['productservice:8080']
